name: v1.0 process integration and evidence audit

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "pyproject.toml"
      - ".github/workflows/v1-methodological.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  v1-equations-and-provenance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install stdlib-only project
        run: python -m pip install -e .
      - name: Run independent analytical, negative and legacy tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce full source-separated site and price sensitivity study
        run: python -m site_screen.research_cli --input data/synthetic_process_sites.json --output results/v1_process_screen.json --scenarios
      - name: Render academic-claims-bounded human-readable report
        run: python -m site_screen.report --input results/v1_process_screen.json --output results/v1_research_summary.md
      - name: Byte-for-byte deterministic replay
        run: |
          cp results/v1_process_screen.json results/reference.json
          python -m site_screen.research_cli --input data/synthetic_process_sites.json --output results/v1_process_screen.json --scenarios
          cmp results/reference.json results/v1_process_screen.json
      - name: Independent audit of energy, assumption and study dimension
        run: |
          python - <<'PY'
          import json,math
          d=json.load(open("results/v1_process_screen.json"))
          assert d["site_count"]==3
          assert sum(x["total_cases"] for x in d["scenario_matrix"])==162
          assert all(x["data_provenance"]=="synthetic" for x in d["cases"])
          for x in d["cases"]:
              assert x["process_heat_balance_verified"] and x["source_heat_balance_verified"]
              assert x["baseline_assumes_ideal_process_heat_recovery"]
              assert not x["compressor_qualified"] and not x["industrial_validation"]
              assert not x["process_HEN_built_or_capex_priced"]
              h=x["annual"]["heat_pump_delivered_kWh"]
              e=x["annual"]["heat_pump_compressor_kWh"]
              s=x["annual"]["external_source_heat_kWh"]
              assert math.isclose(h,e+s,abs_tol=1e-5)
              for b in x["dispatch_blocks"]:
                  assert b["unserved_heat_kW"]==0
                  assert math.isclose(b["baseline_external_heating_kW"],b["hp_delivered_kW"]+b["boiler_remaining_kW"],abs_tol=1e-7)
          print("Process, source, tariff, attribution and economic provenance gates passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v1-synthetic-methodological-evidence-python-${{ matrix.python-version }}
          path: |
            results/v1_process_screen.json
            results/v1_research_summary.md
          if-no-files-found: error
