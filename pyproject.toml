[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-heat-pump-site-screen"
version = "0.1.0"
description = "Transparent preliminary industrial heat-pump site and break-even screening"
requires-python = ">=3.11"
authors = [{name = "Open Energy Methods"}]
keywords = ["heat-pumps", "industrial-heat", "thermoeconomics", "energy-systems"]
dependencies = []

[project.scripts]
industrial-hp-screen = "site_screen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
